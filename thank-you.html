  .card{background:#fff;border:1px solid #dde5ee;border-radius:20px;padding:32px 24px;max-width:480px;width:100%;text-align:center}
  .ok{width:64px;height:64px;border-radius:50%;background:linear-gradient(90deg,#e2561b,#f5862f);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}

<body>
  <div class="card">
    <div class="ok">✓</div>
    <h1>Thank you for your order!</h1>
    <p>Your payment was received. We're preparing your order and you'll receive the tracking number by email as soon as it ships.</p>
    <p id="ord"></p>
    <p><a href="/track/" style="display:inline-block;margin:6px 0 10px;padding:12px 20px;border-radius:12px;background:#f0edf8;color:#1a1625;font-weight:700;text-decoration:none">Track your order →</a></p>
    <p>Questions? Just reply to the confirmation email and our team will help you within 24 business hours.</p>
  </div>
<script>
  let o = null;
  try { o = JSON.parse(localStorage.getItem("last_order") || "null"); } catch(_) {}
  if (o) document.getElementById("ord").innerHTML = 'Order reference: <span class="id">' + o.order_id + '</span>';
  try {
    const key = "purchase_tracked_" + (o ? o.order_id : "x");
    if (window.ttq && !localStorage.getItem(key)) {
      window.ttq.track("CompletePayment", { value: o ? o.total : 44.90, currency: "USD", content_name: o ? o.product : "Corduroy Cuddle Chair" });
      localStorage.setItem(key, "1");
    }
  } catch(_) {}
</script>
